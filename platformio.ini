; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; Pinned pioarduino fork release (Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5).
; The official PlatformIO "espressif32" registry entry never shipped an
; Arduino-ESP32 3.x/IDF5 core; see AUDIO_STABILITY_PLAN.md for rationale.
; Previous working config: platform = espressif32@7.1.3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = time, log2file
board_build.f_cpu = 240000000L
upload_flags = --no-stub

; Force PlatformIO to recursively scan nested library headers
lib_ldf_mode = deep+
extra_scripts = pre:scripts/patch_audio_tools.py

lib_deps = 
	lovyan03/LovyanGFX@^1.2.29
	adafruit/Adafruit GFX Library@^1.12.6
	; adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	; esphome/ESP32-audioI2S@^2.3.0
	adafruit/Adafruit MPR121@^1.2.1
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-libflac.git
    https://github.com/pschatzmann/codec-libfoxenflac.git
    https://github.com/pschatzmann/codec-helix.git
    https://github.com/pschatzmann/codec-ogg.git
    https://github.com/greiman/SdFat.git
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11 -Os
build_flags = 
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DUSE_UTF8_LONG_NAMES=1
    ; SdFat's default SPI transfer path on ESP32 (USE_SPI_ARRAY_TRANSFER=0)
    ; issues one SPI.transfer(0xFF) call PER BYTE for every sector read/write,
    ; instead of one bulk hardware-DMA transfer per sector. Each single-byte
    ; SPI transaction has several microseconds of fixed ESP-IDF dispatch
    ; overhead that swamps the actual bit-clocking time, which is what was
    ; producing the ~9% SD SPI efficiency ceiling seen in hardware logs
    ; (measured ~147ms per 32KB/64-sector read vs. ~13ms theoretical at
    ; 20MHz -- i.e. ~91% pure per-byte call overhead). Forcing mode 1 makes
    ; SdFat call the ESP32 SPI library's bulk transfer(buf, count) overload
    ; (which the framework implements via spiTransferBytes, a real
    ; hardware-batched transfer) once per sector instead of 512 times.
    -DUSE_SPI_ARRAY_TRANSFER=1
    -I.pio/libdeps/seeed_xiao_esp32s3/arduino-libflac/src
    -O2
    

lib_ignore =
    SD
    SD_MMC

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
