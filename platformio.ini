; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
upload_speed = 115200
board_build.f_cpu = 240000000L
upload_flags = --no-stub

; Force PlatformIO to recursively scan nested library headers
lib_ldf_mode = deep+
extra_scripts = pre:scripts/patch_audio_tools.py

lib_deps = 
	lovyan03/LovyanGFX@^1.2.29
	adafruit/Adafruit GFX Library@^1.12.6
	; adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	; esphome/ESP32-audioI2S@^2.3.0
	adafruit/Adafruit MPR121@^1.2.1
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-libflac.git
    https://github.com/pschatzmann/codec-libfoxenflac.git
    https://github.com/pschatzmann/codec-helix.git
    https://github.com/pschatzmann/codec-ogg.git
    https://github.com/greiman/SdFat.git
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -I.pio/libdeps/seeed_xiao_esp32s3/arduino-libflac/src
    

lib_ignore =
    SD
    SD_MMC

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
